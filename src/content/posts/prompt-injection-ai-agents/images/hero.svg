<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
  <style>
    .lbl { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #F1F5F9; }
    .sub { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #94A3B8; }
    .mono { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; fill: #94A3B8; }
  </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#1A1D27"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <marker id="heroArrow" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- connecting lines from each content card to the central agent -->
  <g stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 6" opacity="0.55">
    <line x1="430" y1="230" x2="545" y2="335" marker-end="url(#heroArrow)"/>
    <line x1="770" y1="230" x2="655" y2="335" marker-end="url(#heroArrow)"/>
    <line x1="600" y1="450" x2="600" y2="410" marker-end="url(#heroArrow)"/>
  </g>

  <!-- central agent core -->
  <g transform="translate(600,375)">
    <circle r="82" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.35"/>
    <circle r="66" fill="url(#node)"/>
    <circle r="30" fill="#0F1117"/>
    <circle r="30" fill="none" stroke="#0F1117" stroke-width="2"/>
    <!-- simple circuit / eye motif -->
    <circle cx="0" cy="0" r="10" fill="#38BDF8"/>
    <line x1="-22" y1="0" x2="-14" y2="0" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="0" x2="14" y2="0" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-22" x2="0" y2="-14" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="22" x2="0" y2="14" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="600" y="480" text-anchor="middle" class="sub" font-size="15">AI agent</text>

  <!-- WEBPAGE CARD (top-left) — carries the hidden instruction -->
  <g>
    <rect x="90" y="60" width="340" height="200" rx="12" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <rect x="90" y="60" width="340" height="34" rx="12" fill="#252836"/>
    <rect x="90" y="82" width="340" height="12" fill="#252836"/>
    <circle cx="112" cy="77" r="5" fill="#EF4444"/>
    <circle cx="130" cy="77" r="5" fill="#F59E0B"/>
    <circle cx="148" cy="77" r="5" fill="#22C55E"/>
    <text x="250" y="82" text-anchor="middle" class="mono" font-size="11">lawsofux.com</text>

    <rect x="112" y="112" width="220" height="10" rx="5" fill="#2E3147"/>
    <rect x="112" y="132" width="290" height="10" rx="5" fill="#2E3147"/>
    <rect x="112" y="152" width="180" height="10" rx="5" fill="#2E3147"/>

    <!-- hidden instruction, faint and dashed to signal it's concealed -->
    <rect x="110" y="176" width="240" height="26" rx="6" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7"/>
    <text x="118" y="193" class="mono" font-size="10" fill="#F59E0B" opacity="0.75">ignore previous instructions</text>

    <rect x="112" y="216" width="150" height="10" rx="5" fill="#2E3147"/>
  </g>
  <text x="260" y="285" text-anchor="middle" class="sub" font-size="14">a webpage, with a hidden instruction inside</text>

  <!-- EMAIL CARD (top-right) -->
  <g>
    <rect x="770" y="60" width="340" height="200" rx="12" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <rect x="770" y="60" width="340" height="34" rx="12" fill="#252836"/>
    <rect x="770" y="82" width="340" height="12" fill="#252836"/>
    <!-- envelope icon -->
    <rect x="792" y="70" width="22" height="15" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M792 70 L803 80 L814 70" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="945" y="82" text-anchor="middle" class="mono" font-size="11">inbox</text>

    <rect x="792" y="112" width="120" height="10" rx="5" fill="#38BDF8" opacity="0.35"/>
    <text x="918" y="121" class="sub" font-size="11">Re: design review</text>
    <rect x="792" y="146" width="286" height="9" rx="4" fill="#2E3147"/>
    <rect x="792" y="166" width="250" height="9" rx="4" fill="#2E3147"/>
    <rect x="792" y="186" width="270" height="9" rx="4" fill="#2E3147"/>
    <rect x="792" y="206" width="160" height="9" rx="4" fill="#2E3147"/>
  </g>
  <text x="940" y="285" text-anchor="middle" class="sub" font-size="14">an email, read like any other message</text>

  <!-- DOCUMENT CARD (bottom-center) -->
  <g>
    <rect x="430" y="450" width="340" height="140" rx="12" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <!-- page icon with folded corner -->
    <path d="M456 470 L500 470 L512 482 L512 530 L456 530 Z" fill="#252836" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M500 470 L500 482 L512 482 Z" fill="#1A1D27" stroke="#94A3B8" stroke-width="1.2"/>
    <rect x="540" y="474" width="200" height="9" rx="4" fill="#2E3147"/>
    <rect x="540" y="492" width="180" height="9" rx="4" fill="#2E3147"/>
    <rect x="540" y="510" width="210" height="9" rx="4" fill="#2E3147"/>
    <rect x="456" y="546" width="284" height="9" rx="4" fill="#2E3147"/>
    <rect x="456" y="564" width="200" height="9" rx="4" fill="#2E3147"/>
  </g>
  <text x="600" y="612" text-anchor="middle" class="sub" font-size="14">a document, parsed line by line</text>
</svg>