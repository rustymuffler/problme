<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
  <style>
    .lbl { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #F1F5F9; }
    .sub { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #94A3B8; }
    .mono { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; fill: #94A3B8; }
  </style>
    <linearGradient id="node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <marker id="pArrow" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#0F1117"/>
  <text x="550" y="40" text-anchor="middle" class="lbl" font-size="20" font-weight="700">probl.me's research-fetch step</text>
  <text x="550" y="62" text-anchor="middle" class="sub" font-size="13">where this article's own pipeline touches untrusted content</text>

  <!-- connecting line -->
  <line x1="176" y1="300" x2="374" y2="300" stroke="#2E3147" stroke-width="2" marker-end="url(#pArrow)"/>
  <line x1="466" y1="300" x2="654" y2="300" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#pArrow)"/>
  <line x1="746" y1="300" x2="934" y2="300" stroke="#2DD4BF" stroke-width="2" marker-end="url(#pArrow)"/>

  <!-- node 1: external webpage -->
  <g>
    <circle cx="130" cy="300" r="46" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <rect x="108" y="282" width="44" height="32" rx="4" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <line x1="108" y1="291" x2="152" y2="291" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="116" y1="300" x2="136" y2="300" stroke="#2E3147" stroke-width="2"/>
    <line x1="116" y1="308" x2="142" y2="308" stroke="#2E3147" stroke-width="2"/>
  </g>
  <text x="130" y="378" text-anchor="middle" class="lbl" font-size="14" font-weight="700">External page</text>
  <text x="130" y="396" text-anchor="middle" class="mono" font-size="11">lawsofux.com</text>

  <!-- node 2: agent fetch, flagged -->
  <g>
    <circle cx="420" cy="300" r="50" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="420" cy="300" r="40" fill="url(#node)"/>
    <circle cx="420" cy="300" r="16" fill="#0F1117"/>
    <circle cx="420" cy="300" r="5" fill="#38BDF8"/>
    <!-- warning flag badge -->
    <g transform="translate(454,262)">
      <path d="M0 -16 L14 10 L-14 10 Z" fill="#F59E0B" stroke="#0F1117" stroke-width="1.5"/>
      <text x="0" y="7" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#0F1117">!</text>
    </g>
  </g>
  <text x="420" y="382" text-anchor="middle" class="lbl" font-size="14" font-weight="700">Fetch</text>
  <text x="420" y="400" text-anchor="middle" class="sub" font-size="11">flagged as untrusted</text>

  <!-- node 3: treated as data -->
  <g>
    <circle cx="700" cy="300" r="46" fill="#1A1D27" stroke="#2DD4BF" stroke-width="2"/>
    <path d="M 686 296 v -8 a14 14 0 0 1 28 0 v 8" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <rect x="682" y="296" width="36" height="24" rx="4" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
  </g>
  <text x="700" y="378" text-anchor="middle" class="lbl" font-size="14" font-weight="700">Treated as data</text>
  <text x="700" y="396" text-anchor="middle" class="sub" font-size="11">read, not obeyed</text>

  <!-- node 4: draft -->
  <g>
    <circle cx="980" cy="300" r="46" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <path d="M 964 316 l 20 -20 l 8 8 l -20 20 h -8 z" fill="none" stroke="#94A3B8" stroke-width="2"/>
  </g>
  <text x="980" y="378" text-anchor="middle" class="lbl" font-size="14" font-weight="700">Draft stage</text>
  <text x="980" y="396" text-anchor="middle" class="sub" font-size="11">article gets written</text>

  <!-- annotation callout -->
  <rect x="245" y="430" width="350" height="60" rx="10" fill="#1A1D27" stroke="#F59E0B" stroke-width="2"/>
  <text x="420" y="455" text-anchor="middle" class="lbl" font-size="13" font-weight="700">Every fetched page is untrusted by default</text>
  <text x="420" y="475" text-anchor="middle" class="sub" font-size="12">its content can't redirect what the agent does next</text>
</svg>