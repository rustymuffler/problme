<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
  <style>
    .lbl { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #F1F5F9; }
    .sub { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #94A3B8; }
    .mono { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; fill: #94A3B8; }
  </style>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="#0F1117"/>
  <line x1="550" y1="40" x2="550" y2="520" stroke="#2E3147" stroke-width="2"/>

  <!-- LEFT PANEL: unrestricted access, acts immediately -->
  <text x="275" y="55" text-anchor="middle" class="lbl" font-size="23" font-weight="700">Unrestricted tool access</text>
  <text x="275" y="82" text-anchor="middle" class="sub" font-size="15">acts on fetched content immediately</text>

  <g stroke="#2E3147" stroke-width="2">
    <line x1="90" y1="300" x2="460" y2="300"/>
  </g>
  <g fill="#252836" stroke="#2E3147" stroke-width="2">
    <circle cx="120" cy="300" r="15"/>
    <circle cx="220" cy="300" r="15"/>
  </g>
  <circle cx="420" cy="300" r="18" fill="#EF4444" stroke="#EF4444"/>

  <path d="M220 262 Q 320 165 420 262" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="320" y="158" text-anchor="middle" fill="#EF4444" class="sub" font-size="14">no checkpoint in between</text>

  <text x="120" y="340" text-anchor="middle" class="mono" font-size="12">fetch</text>
  <text x="220" y="340" text-anchor="middle" class="mono" font-size="12">reads</text>
  <text x="420" y="340" text-anchor="middle" class="mono" font-size="12">executes</text>

  <rect x="120" y="410" width="310" height="76" rx="10" fill="#1A1D27" stroke="#EF4444" stroke-width="2"/>
  <text x="275" y="440" text-anchor="middle" class="lbl" font-size="15" font-weight="700">Hidden instruction reaches the tool</text>
  <text x="275" y="462" text-anchor="middle" class="sub" font-size="13">nothing stood between reading and doing</text>

  <!-- RIGHT PANEL: limited access, human approval gate -->
  <text x="825" y="55" text-anchor="middle" class="lbl" font-size="23" font-weight="700">Limited access + approval</text>
  <text x="825" y="82" text-anchor="middle" class="sub" font-size="15">pauses before anything consequential</text>

  <g stroke="#2E3147" stroke-width="2">
    <line x1="640" y1="300" x2="1010" y2="300"/>
  </g>
  <g fill="#252836" stroke="#2E3147" stroke-width="2">
    <circle cx="670" cy="300" r="15"/>
    <circle cx="770" cy="300" r="15"/>
  </g>

  <!-- approval gate -->
  <g transform="translate(870,300)">
    <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#1A1D27" stroke="#F59E0B" stroke-width="3" transform="rotate(45)"/>
    <text x="0" y="6" text-anchor="middle" class="lbl" font-size="16" font-weight="700" fill="#F59E0B">?</text>
  </g>
  <line x1="870" y1="260" x2="870" y2="200" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <!-- person icon: the human approver -->
  <g transform="translate(870,175)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M-14 24 a14 16 0 0 1 28 0" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  </g>

  <circle cx="970" cy="300" r="18" fill="#22C55E" stroke="#22C55E"/>
  <path d="M962 300 l6 6 l12 -14" fill="none" stroke="#0F1117" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="670" y="340" text-anchor="middle" class="mono" font-size="12">fetch</text>
  <text x="770" y="340" text-anchor="middle" class="mono" font-size="12">reads</text>
  <text x="870" y="340" text-anchor="middle" class="mono" font-size="11">approves</text>
  <text x="970" y="340" text-anchor="middle" class="mono" font-size="12">executes</text>

  <rect x="670" y="410" width="310" height="76" rx="10" fill="#1A1D27" stroke="#2DD4BF" stroke-width="2"/>
  <text x="825" y="440" text-anchor="middle" class="lbl" font-size="15" font-weight="700">A person checks the risky step</text>
  <text x="825" y="462" text-anchor="middle" class="sub" font-size="13">a hidden instruction can't act on its own</text>
</svg>