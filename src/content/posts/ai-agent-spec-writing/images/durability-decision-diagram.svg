<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
  <style>
    .lbl { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #F1F5F9; }
    .sub { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #94A3B8; }
  </style>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#1A1D27"/>
    </linearGradient>
    <linearGradient id="node5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="url(#bg5)"/>

  <text x="550" y="55" text-anchor="middle" class="lbl" font-size="24" font-weight="700">Durability Decides the Ceremony</text>

  <!-- diamond decision node -->
  <g transform="translate(550,190)">
    <polygon points="0,-55 130,0 0,55 -130,0" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" class="lbl" font-size="14" font-weight="700">Does this outcome</text>
    <text x="0" y="15" text-anchor="middle" class="lbl" font-size="14" font-weight="700">need to survive?</text>
  </g>

  <path d="M420 190 L 230 190" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow3)"/>
  <path d="M680 190 L 870 190" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- left: no -->
  <g transform="translate(150,190)">
    <rect x="-140" y="-70" width="280" height="140" rx="12" fill="#0F1117" stroke="#2E3147" stroke-width="2"/>
    <text x="0" y="-35" text-anchor="middle" class="lbl" font-size="15" font-weight="700">No</text>
    <text x="0" y="-10" text-anchor="middle" class="sub" font-size="13">one-off script,</text>
    <text x="0" y="10" text-anchor="middle" class="sub" font-size="13">throwaway prototype</text>
    <text x="0" y="38" text-anchor="middle" class="lbl" font-size="14">skip the ceremony</text>
  </g>

  <!-- right: yes -->
  <g transform="translate(950,190)">
    <rect x="-140" y="-70" width="280" height="140" rx="12" fill="#0F1117" stroke="url(#node5)" stroke-width="3"/>
    <text x="0" y="-35" text-anchor="middle" class="lbl" font-size="15" font-weight="700">Yes</text>
    <text x="0" y="-10" text-anchor="middle" class="sub" font-size="13">future session, PR,</text>
    <text x="0" y="10" text-anchor="middle" class="sub" font-size="13">or reader depends on it</text>
    <text x="0" y="38" text-anchor="middle" class="lbl" font-size="14">write the check</text>
  </g>

  <text x="550" y="420" text-anchor="middle" class="sub" font-size="16">10 minutes writing a verification step is cheaper than finding</text>
  <text x="550" y="445" text-anchor="middle" class="sub" font-size="16">the same gap twice.</text>
</svg>
