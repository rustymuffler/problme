<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
  <style>
    .lbl { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #F1F5F9; }
    .sub { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #94A3B8; }
  </style>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#1A1D27"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="560" fill="url(#bg4)"/>

  <text x="550" y="55" text-anchor="middle" class="lbl" font-size="24" font-weight="700">Two Layers, Not One</text>

  <!-- layer 1: agent + self check -->
  <g transform="translate(320,220)">
    <rect x="-190" y="-90" width="380" height="180" rx="14" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <text x="0" y="-55" text-anchor="middle" class="lbl" font-size="16" font-weight="700">Layer 1: Self-Check</text>
    <circle cx="-110" cy="10" r="30" fill="#38BDF8"/>
    <text x="-110" y="16" text-anchor="middle" class="lbl" font-size="13" font-weight="700">A</text>
    <path d="M-60 10 L 40 10" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="2 6"/>
    <circle cx="90" cy="10" r="26" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M77,10 L87,20 L104,-2" fill="none" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="65" text-anchor="middle" class="sub" font-size="13">same agent checks its own work</text>
  </g>

  <!-- layer 2: independent review -->
  <g transform="translate(780,220)">
    <rect x="-190" y="-90" width="380" height="180" rx="14" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <text x="0" y="-55" text-anchor="middle" class="lbl" font-size="16" font-weight="700">Layer 2: Independent Review</text>
    <circle cx="-110" cy="10" r="30" fill="#38BDF8" opacity="0.5"/>
    <text x="-110" y="16" text-anchor="middle" class="lbl" font-size="13" font-weight="700">A</text>
    <path d="M-60 10 L 40 10" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="2 6"/>
    <circle cx="90" cy="10" r="30" fill="#2DD4BF"/>
    <text x="90" y="16" text-anchor="middle" class="lbl" font-size="13" font-weight="700">B</text>
    <text x="0" y="65" text-anchor="middle" class="sub" font-size="13">a separate agent reviews agent A</text>
  </g>

  <text x="550" y="380" text-anchor="middle" class="sub" font-size="16">a self-check catches a skipped step. it can't catch its own blind spot.</text>
  <text x="550" y="410" text-anchor="middle" class="sub" font-size="16">that's what layer 2 is for.</text>
</svg>
