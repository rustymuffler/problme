<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
  <style>
    .lbl { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #F1F5F9; }
    .sub { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #94A3B8; }
  </style>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#1A1D27"/>
    </linearGradient>
    <linearGradient id="node2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="url(#bg3)"/>

  <text x="550" y="55" text-anchor="middle" class="lbl" font-size="24" font-weight="700">A Spec With a Built-In Check</text>

  <!-- box 1: instruction -->
  <g transform="translate(170,260)">
    <rect x="-110" y="-60" width="220" height="120" rx="12" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" class="lbl" font-size="15" font-weight="700">1. Instruction</text>
    <text x="0" y="10" text-anchor="middle" class="sub" font-size="12">"update status</text>
    <text x="0" y="28" text-anchor="middle" class="sub" font-size="12">after PR merges"</text>
  </g>

  <path d="M290 260 L 400 260" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- box 2: task run -->
  <g transform="translate(510,260)">
    <rect x="-110" y="-60" width="220" height="120" rx="12" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" class="lbl" font-size="15" font-weight="700">2. Task Run</text>
    <text x="0" y="10" text-anchor="middle" class="sub" font-size="12">session does the</text>
    <text x="0" y="28" text-anchor="middle" class="sub" font-size="12">work, maybe skips it</text>
  </g>

  <path d="M630 260 L 740 260" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- box 3: verification -->
  <g transform="translate(870,260)">
    <rect x="-120" y="-60" width="240" height="120" rx="12" fill="#0F1117" stroke="url(#node2)" stroke-width="3"/>
    <text x="0" y="-15" text-anchor="middle" class="lbl" font-size="15" font-weight="700">3. Verify</text>
    <text x="0" y="10" text-anchor="middle" class="sub" font-size="12">diff repo state</text>
    <text x="0" y="28" text-anchor="middle" class="sub" font-size="12">against the spec</text>
  </g>

  <!-- loop back arrow -->
  <path d="M870 200 C 870 100, 170 100, 170 200" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 7" marker-end="url(#arrow2)"/>
  <text x="520" y="110" text-anchor="middle" class="sub" font-size="13">fail: fix before closing session</text>

  <text x="550" y="450" text-anchor="middle" class="sub" font-size="16">a fresh session can run step 3 without trusting step 2 happened</text>
</svg>
