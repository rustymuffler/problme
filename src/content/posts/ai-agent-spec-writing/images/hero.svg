<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
  <style>
    .lbl { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #F1F5F9; }
    .sub { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #94A3B8; }
    .mono { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; fill: #94A3B8; }
  </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#1A1D27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- spec document card -->
  <g transform="translate(330,180)">
    <rect x="-150" y="0" width="300" height="270" rx="14" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <rect x="-150" y="0" width="300" height="36" rx="14" fill="#252836"/>
    <circle cx="-126" cy="18" r="5" fill="#EF4444"/>
    <circle cx="-108" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="-90" cy="18" r="5" fill="#22C55E"/>
    <text x="0" y="23" text-anchor="middle" class="mono" font-size="13">spec.md</text>

    <rect x="-120" y="56" width="240" height="10" rx="5" fill="#2E3147"/>
    <rect x="-120" y="76" width="200" height="10" rx="5" fill="#2E3147"/>
    <rect x="-120" y="96" width="220" height="10" rx="5" fill="#2E3147"/>

    <rect x="-120" y="130" width="240" height="34" rx="8" fill="#0F1117" stroke="url(#accent)" stroke-width="2"/>
    <text x="0" y="152" text-anchor="middle" class="lbl" font-size="13">+ verification step</text>

    <rect x="-120" y="180" width="150" height="10" rx="5" fill="#2E3147"/>
    <rect x="-120" y="200" width="210" height="10" rx="5" fill="#2E3147"/>
  </g>

  <!-- arrow to check -->
  <path d="M500 300 C 570 300, 570 300, 640 300" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="2 7"/>
  <polygon points="638,293 654,300 638,307" fill="#2DD4BF"/>

  <!-- checkmark loop node -->
  <g transform="translate(760,300)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M-28,0 L-8,22 L32,-24" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40,-55 A 75 75 0 0 1 40,55" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 6" opacity="0.5" marker-end="url(#arrow)"/>
  </g>

  <text x="600" y="65" text-anchor="middle" class="lbl" font-size="30" font-weight="700">Writing a Spec Your AI Agent Can</text>
  <text x="600" y="105" text-anchor="middle" class="lbl" font-size="30" font-weight="700">Actually Keep Following</text>
  <text x="600" y="560" text-anchor="middle" class="sub" font-size="16">a task written down is not the same as a task verified</text>
</svg>
