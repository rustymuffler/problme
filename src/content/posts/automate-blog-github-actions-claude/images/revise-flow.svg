<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="The revise command: a comment is checked, the Writer edits text and plans images, an Image Creator draws, safety checks run, then the result is committed and a reply is posted"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#B6A88F"/></marker></defs><rect x="0" y="0" width="1200" height="640" fill="#15120E"/><rect x="30" y="100" width="340" height="150" rx="14" fill="#1C1812" stroke="#F2A24B" stroke-width="3"/><text x="200" y="170" font-family="JetBrains Mono, monospace" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">@claude revise ...</text><text x="200" y="208" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#F2A24B" text-anchor="middle">your comment</text><rect x="430" y="100" width="340" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="600" y="169" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">1 Owner checks</text><text x="600" y="205" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">you, open article PR</text><rect x="830" y="100" width="340" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="1000" y="169" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">2 Writer</text><text x="1000" y="205" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">edits text, plans images</text><line x1="376" y1="175" x2="424" y2="175" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><line x1="776" y1="175" x2="824" y2="175" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><rect x="30" y="360" width="340" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="200" y="429" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">3 Image Creator</text><text x="200" y="465" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">draws SVGs, validated</text><rect x="430" y="360" width="340" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="600" y="429" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">4 Safety checks</text><text x="600" y="465" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">files, lint, links</text><rect x="830" y="360" width="340" height="150" rx="14" fill="#1C1812" stroke="#9DB066" stroke-width="3"/><text x="1000" y="429" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">5 Commit + reply</text><text x="1000" y="465" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">same branch, same PR</text><line x1="376" y1="435" x2="424" y2="435" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><line x1="776" y1="435" x2="824" y2="435" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><path d="M 1000 256 L 1000 300 L 200 300 L 200 350" fill="none" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><text x="600" y="590" font-family="Hanken Grotesk, sans-serif" font-size="24" font-weight="400" fill="#B6A88F" text-anchor="middle">If the image step fails, the text changes still go ahead.</text></svg>