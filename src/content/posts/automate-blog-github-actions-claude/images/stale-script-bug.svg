<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Two rows showing how the open pull request step ran an old script from the branch, and the fix of copying the tools aside first"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#B6A88F"/></marker></defs><rect x="0" y="0" width="1200" height="640" fill="#15120E"/><text x="30" y="66" font-family="Hanken Grotesk, sans-serif" font-size="28" font-weight="700" fill="#E8674A" text-anchor="start">What went wrong</text><rect x="30" y="90" width="340" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="200" y="159" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">1 Checkout main</text><text x="200" y="195" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">the scripts are new</text><rect x="430" y="90" width="340" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="600" y="159" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">2 Publish step</text><text x="600" y="195" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">checks out the branch</text><line x1="376" y1="165" x2="424" y2="165" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><rect x="830" y="90" width="340" height="150" rx="14" fill="#1C1812" stroke="#E8674A" stroke-width="3"/><text x="1000" y="159" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">3 Open PR step</text><text x="1000" y="195" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">runs the old copy</text><line x1="776" y1="165" x2="824" y2="165" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><text x="1000" y="270" font-family="Hanken Grotesk, sans-serif" font-size="24" font-weight="700" fill="#E8674A" text-anchor="middle">Result: HTTP 401, four times</text><text x="30" y="360" font-family="Hanken Grotesk, sans-serif" font-size="28" font-weight="700" fill="#9DB066" text-anchor="start">The fix</text><rect x="30" y="384" width="340" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="200" y="453" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">1 Copy tools aside</text><text x="200" y="489" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">before any checkout</text><rect x="430" y="384" width="340" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="600" y="453" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">2 Publish step</text><text x="600" y="489" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">checks out the branch</text><line x1="376" y1="459" x2="424" y2="459" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><rect x="830" y="384" width="340" height="150" rx="14" fill="#1C1812" stroke="#9DB066" stroke-width="3"/><text x="1000" y="453" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">3 Open PR step</text><text x="1000" y="489" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">runs the safe copy</text><line x1="776" y1="459" x2="824" y2="459" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><text x="1000" y="564" font-family="Hanken Grotesk, sans-serif" font-size="24" font-weight="700" fill="#9DB066" text-anchor="middle">Result: the pull request opens</text></svg>