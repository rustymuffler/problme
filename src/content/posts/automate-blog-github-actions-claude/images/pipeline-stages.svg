<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="The nine stages of the blog pipeline, with the two stages that need the owner on a phone highlighted"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#B6A88F"/></marker></defs><rect x="0" y="0" width="1200" height="700" fill="#15120E"/><rect x="30" y="110" width="240" height="150" rx="14" fill="#1C1812" stroke="#F2A24B" stroke-width="3"/><text x="150" y="179" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">1 Idea</text><text x="150" y="215" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#F2A24B" text-anchor="middle">you, in an issue</text><rect x="330" y="110" width="240" height="150" rx="14" fill="#1C1812" stroke="#F2A24B" stroke-width="3"/><text x="450" y="179" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">2 Interview</text><text x="450" y="215" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#F2A24B" text-anchor="middle">you, in the issue</text><line x1="272" y1="185" x2="324" y2="185" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><rect x="630" y="110" width="240" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="750" y="179" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">3 Research</text><text x="750" y="215" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">web, read-only</text><line x1="572" y1="185" x2="624" y2="185" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><rect x="930" y="110" width="240" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="1050" y="179" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">4 Draft</text><text x="1050" y="215" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">no web, no shell</text><line x1="872" y1="185" x2="924" y2="185" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><rect x="30" y="370" width="240" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="150" y="439" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">5 Images</text><text x="150" y="475" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">SVG, checked</text><rect x="330" y="370" width="240" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="450" y="439" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">6 Reviews</text><text x="450" y="475" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">up to 3 passes</text><line x1="272" y1="445" x2="324" y2="445" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><rect x="630" y="370" width="240" height="150" rx="14" fill="#1C1812" stroke="#3D3322" stroke-width="2"/><text x="750" y="439" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">7 Pull request</text><text x="750" y="475" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#B6A88F" text-anchor="middle">Vercel preview</text><line x1="572" y1="445" x2="624" y2="445" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><rect x="930" y="370" width="240" height="150" rx="14" fill="#1C1812" stroke="#F2A24B" stroke-width="3"/><text x="1050" y="439" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">8 Merge</text><text x="1050" y="475" font-family="Hanken Grotesk, sans-serif" font-size="21" font-weight="400" fill="#F2A24B" text-anchor="middle">you, on a phone</text><line x1="872" y1="445" x2="924" y2="445" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><path d="M 1050 266 L 1050 312 L 150 312 L 150 360" fill="none" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><line x1="1050" y1="526" x2="1050" y2="596" stroke="#B6A88F" stroke-width="3" marker-end="url(#ar)"/><rect x="30" y="600" width="1140" height="70" rx="14" fill="#1C1812" stroke="#9DB066" stroke-width="3"/><text x="600" y="646" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#F4EFE6" text-anchor="middle">9 Live check: the page, sitemap, RSS and llms.txt</text><text x="600" y="58" font-family="Hanken Grotesk, sans-serif" font-size="28" font-weight="700" fill="#F4EFE6" text-anchor="middle">You answer questions and tap merge. The rest runs in GitHub Actions.</text></svg>