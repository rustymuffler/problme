<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#1A1D27"/>
    </linearGradient>
    <linearGradient id="pin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint commit chain background -->
  <g stroke="#2E3147" stroke-width="2" fill="none" opacity="0.6">
    <line x1="120" y1="500" x2="1080" y2="500"/>
  </g>
  <g fill="#252836" stroke="#2E3147" stroke-width="2">
    <circle cx="180" cy="500" r="14"/>
    <circle cx="340" cy="500" r="14"/>
    <circle cx="500" cy="500" r="14"/>
    <circle cx="820" cy="500" r="14"/>
    <circle cx="980" cy="500" r="14"/>
  </g>

  <!-- the malicious/moved tag, floating away, amber -->
  <g transform="translate(660,320) rotate(18)" opacity="0.95">
    <path d="M0 0 L70 0 L92 22 L70 44 L0 44 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 6"/>
    <circle cx="18" cy="22" r="5" fill="#F59E0B"/>
    <text x="36" y="28" font-family="'JetBrains Mono', monospace" font-size="16" fill="#F59E0B">v4</text>
  </g>
  <line x1="720" y1="360" x2="820" y2="486" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 5" opacity="0.7"/>

  <!-- the pinned commit, solid, centered, blue/teal -->
  <g transform="translate(660,500)">
    <line x1="0" y1="0" x2="1" y2="-160" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <circle r="26" fill="url(#pin)"/>
    <circle r="10" fill="#0F1117"/>
  </g>

  <!-- commit sha label -->
  <g transform="translate(660,190)">
    <rect x="-210" y="-38" width="420" height="64" rx="10" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="24" fill="#F1F5F9">34e114876b0b11...4f8d5</text>
  </g>

  <text x="600" y="120" text-anchor="middle" font-family="'DejaVu Sans', Arial, sans-serif" font-size="28" font-weight="700" fill="#94A3B8" letter-spacing="1">ONE COMMIT. NEVER MOVES.</text>
</svg>
