<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
  <style>
    .lbl { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #F1F5F9; }
    .sub { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #94A3B8; }
    .mono { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; fill: #94A3B8; }
  </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#1A1D27"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- flowing chain of six pipeline-stage nodes -->
  <g stroke="#2DD4BF" stroke-width="2" stroke-dasharray="2 7" opacity="0.6">
    <line x1="150" y1="255" x2="330" y2="255"/>
    <line x1="330" y1="255" x2="510" y2="255"/>
    <line x1="510" y1="255" x2="690" y2="255"/>
    <line x1="690" y1="255" x2="870" y2="255"/>
    <line x1="870" y1="255" x2="1050" y2="255"/>
  </g>

  <g>
    <circle cx="150" cy="255" r="26" fill="url(#node)"/>
    <circle cx="330" cy="255" r="26" fill="url(#node)" opacity="0.9"/>
    <circle cx="510" cy="255" r="26" fill="url(#node)" opacity="0.8"/>
    <circle cx="690" cy="255" r="26" fill="url(#node)" opacity="0.7"/>
    <circle cx="870" cy="255" r="26" fill="url(#node)" opacity="0.6"/>
    <circle cx="1050" cy="255" r="26" fill="url(#node)" opacity="0.5"/>
  </g>

  <!-- revision loop arc, back from stage 5 to stage 3 -->
  <path d="M870 229 C 750 130, 630 130, 510 229" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 6" opacity="0.4"/>

  <!-- markdown file card, the pipeline's actual source of truth -->
  <g transform="translate(600,420)">
    <rect x="-190" y="0" width="380" height="130" rx="14" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <rect x="-190" y="0" width="380" height="36" rx="14" fill="#252836"/>
    <circle cx="-166" cy="18" r="5" fill="#EF4444"/>
    <circle cx="-148" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="-130" cy="18" r="5" fill="#22C55E"/>
    <text x="0" y="23" text-anchor="middle" class="mono" font-size="13">AGENTS.md</text>

    <rect x="-160" y="56" width="200" height="10" rx="5" fill="#2E3147"/>
    <rect x="-160" y="76" width="260" height="10" rx="5" fill="#2E3147"/>
    <rect x="-160" y="96" width="150" height="10" rx="5" fill="#2E3147"/>
  </g>

  <text x="600" y="600" text-anchor="middle" class="sub" font-size="15">a content pipeline, defined as a single markdown file</text>
</svg>
