<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .lbl { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #F1F5F9; }
      .sub { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #94A3B8; }
      .mono { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; fill: #94A3B8; }
    </style>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="#0F1117"/>
  <line x1="550" y1="40" x2="550" y2="520" stroke="#2E3147" stroke-width="2"/>

  <!-- LEFT PANEL: before -->
  <text x="275" y="55" text-anchor="middle" class="lbl" font-size="22" font-weight="700">Before</text>
  <text x="275" y="80" text-anchor="middle" class="sub" font-size="14">a PR crosses both tracks, neither one checks it</text>

  <line x1="70" y1="160" x2="460" y2="160" stroke="#2E3147" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="70" y="145" class="sub" font-size="12">Content pipeline</text>

  <line x1="70" y1="370" x2="460" y2="370" stroke="#2E3147" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="70" y="355" class="sub" font-size="12">Code pipeline</text>

  <!-- PR crossing both lanes with no checkpoint -->
  <rect x="245" y="245" width="60" height="40" rx="8" fill="#1A1D27" stroke="#F59E0B" stroke-width="2"/>
  <text x="275" y="270" text-anchor="middle" class="mono" font-size="12" fill="#F59E0B">PR #72</text>
  <line x1="260" y1="245" x2="180" y2="170" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="290" y1="285" x2="360" y2="360" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 5"/>

  <g transform="translate(275,265)">
    <circle r="34" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="3 5" opacity="0.8"/>
  </g>
  <line x1="252" y1="242" x2="298" y2="288" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="298" y1="242" x2="252" y2="288" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

  <rect x="90" y="440" width="370" height="66" rx="10" fill="#1A1D27" stroke="#EF4444" stroke-width="2"/>
  <text x="275" y="465" text-anchor="middle" class="lbl" font-size="14" font-weight="700">No checkpoint fires</text>
  <text x="275" y="486" text-anchor="middle" class="sub" font-size="12">Aikido and Semgrep never run</text>

  <!-- RIGHT PANEL: after -->
  <text x="825" y="55" text-anchor="middle" class="lbl" font-size="22" font-weight="700">After</text>
  <text x="825" y="80" text-anchor="middle" class="sub" font-size="14">the same crossing now hits a shared checkpoint</text>

  <line x1="620" y1="160" x2="1010" y2="160" stroke="#2E3147" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="620" y="145" class="sub" font-size="12">Content pipeline</text>

  <line x1="620" y1="370" x2="1010" y2="370" stroke="#2E3147" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="620" y="355" class="sub" font-size="12">Code pipeline</text>

  <rect x="795" y="245" width="60" height="40" rx="8" fill="#1A1D27" stroke="#38BDF8" stroke-width="2"/>
  <text x="825" y="270" text-anchor="middle" class="mono" font-size="12" fill="#38BDF8">PR</text>
  <line x1="810" y1="245" x2="730" y2="170" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="840" y1="285" x2="910" y2="360" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- shared checkpoint shield -->
  <g transform="translate(825,265)">
    <path d="M0 -32 L28 -18 V14 C28 34 12 46 0 52 C-12 46 -28 34 -28 14 V-18 Z" fill="#1A1D27" stroke="#22C55E" stroke-width="3"/>
    <path d="M-11 0 l7 8 l16 -18" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="640" y="440" width="370" height="66" rx="10" fill="#1A1D27" stroke="#22C55E" stroke-width="2"/>
  <text x="825" y="465" text-anchor="middle" class="lbl" font-size="14" font-weight="700">Shared checkpoint fires</text>
  <text x="825" y="486" text-anchor="middle" class="sub" font-size="12">Security Auditor + Code Reviewer on both tracks</text>
</svg>
