<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .lbl { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #F1F5F9; }
      .sub { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #94A3B8; }
      .mono { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; fill: #94A3B8; }
    </style>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="#0F1117"/>

  <text x="550" y="34" text-anchor="middle" class="lbl" font-size="19" font-weight="700">Where fetched content meets research-brief.md</text>

  <!-- BEFORE band -->
  <text x="550" y="90" text-anchor="middle" class="lbl" font-size="16" font-weight="700" fill="#F59E0B">Before</text>

  <g transform="translate(160,175)">
    <circle r="38" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <rect x="-20" y="-16" width="40" height="28" rx="3" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <line x1="-20" y1="-7" x2="20" y2="-7" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="160" y="232" text-anchor="middle" class="sub" font-size="12">fetched web content</text>

  <line x1="206" y1="175" x2="480" y2="175" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrowB)"/>
  <text x="343" y="157" text-anchor="middle" class="sub" font-size="12" fill="#F59E0B">no checkpoint in between</text>

  <g transform="translate(530,175)">
    <path d="M-24 -30 L8 -30 L24 -14 L24 30 L-24 30 Z" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <path d="M8 -30 L8 -14 L24 -14 Z" fill="#0F1117" stroke="#2E3147" stroke-width="1.5"/>
    <line x1="-14" y1="-4" x2="14" y2="-4" stroke="#2E3147" stroke-width="3"/>
    <line x1="-14" y1="8" x2="14" y2="8" stroke="#2E3147" stroke-width="3"/>
    <line x1="-14" y1="20" x2="14" y2="20" stroke="#2E3147" stroke-width="3"/>
  </g>
  <text x="530" y="232" text-anchor="middle" class="sub" font-size="12">research-brief.md</text>
  <text x="530" y="248" text-anchor="middle" class="sub" font-size="11">written directly</text>

  <line x1="60" y1="285" x2="1040" y2="285" stroke="#2E3147" stroke-width="1"/>

  <!-- AFTER band -->
  <text x="550" y="330" text-anchor="middle" class="lbl" font-size="16" font-weight="700" fill="#22C55E">After</text>

  <g transform="translate(150,400)">
    <circle r="34" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
    <rect x="-18" y="-14" width="36" height="24" rx="3" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <line x1="-18" y1="-6" x2="18" y2="-6" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="150" y="452" text-anchor="middle" class="sub" font-size="12">fetched web content</text>

  <line x1="192" y1="400" x2="316" y2="400" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowB)"/>

  <!-- scan checkpoint -->
  <g transform="translate(380,400)">
    <path d="M0 -28 L24 -16 V12 C24 30 11 40 0 45 C-11 40 -24 30 -24 12 V-16 Z" fill="#1A1D27" stroke="#38BDF8" stroke-width="3"/>
    <circle r="8" fill="#38BDF8"/>
  </g>
  <text x="380" y="465" text-anchor="middle" class="lbl" font-size="12" font-weight="700">scan-untrusted-content.mjs</text>
  <text x="380" y="481" text-anchor="middle" class="sub" font-size="11">@stackone/defender, advisory only</text>

  <line x1="428" y1="400" x2="552" y2="400" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowB)"/>

  <!-- human review -->
  <g transform="translate(610,400)">
    <circle r="25" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="0" cy="-4" r="8" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M-13 15 a13 14 0 0 1 26 0" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  </g>
  <text x="610" y="452" text-anchor="middle" class="lbl" font-size="12" font-weight="700">human reads the flag</text>

  <line x1="650" y1="400" x2="774" y2="400" stroke="#22C55E" stroke-width="2.5" marker-end="url(#arrowB)"/>

  <g transform="translate(840,400)">
    <path d="M-22 -28 L8 -28 L22 -14 L22 28 L-22 28 Z" fill="#1A1D27" stroke="#22C55E" stroke-width="2.5"/>
    <path d="M8 -28 L8 -14 L22 -14 Z" fill="#0F1117" stroke="#22C55E" stroke-width="2"/>
    <line x1="-13" y1="-4" x2="13" y2="-4" stroke="#22C55E" stroke-width="3"/>
    <line x1="-13" y1="8" x2="13" y2="8" stroke="#22C55E" stroke-width="3"/>
    <line x1="-13" y1="20" x2="13" y2="20" stroke="#22C55E" stroke-width="3"/>
  </g>
  <text x="840" y="452" text-anchor="middle" class="sub" font-size="12">research-brief.md</text>
  <text x="840" y="468" text-anchor="middle" class="sub" font-size="11">the trust boundary</text>

  <rect x="150" y="500" width="800" height="50" rx="10" fill="#1A1D27" stroke="#2E3147" stroke-width="2"/>
  <text x="550" y="522" text-anchor="middle" class="lbl" font-size="13" font-weight="700">Fetched content is data, not instructions</text>
  <text x="550" y="540" text-anchor="middle" class="sub" font-size="11">the Research Agent runs with search / fetch / summarize only, no Bash, Edit, Write, or git</text>
</svg>
