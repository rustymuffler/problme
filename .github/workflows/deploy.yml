name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Scheduled publishing: posts dated in the future are left out of builds
  # (src/lib/publish.ts). This rebuild releases any post whose date has arrived.
  # Tuesdays 14:00 UTC (about 9am US Eastern).
  schedule:
    - cron: '0 14 * * 2'
  workflow_dispatch:

# Allow only one concurrent deployment; cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # onnxruntime-node downloads a CUDA GPU binary on Linux x64 by default;
          # that release asset now 404s and CI has no GPU. Skip it.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
