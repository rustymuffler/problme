name: Security

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks — Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep — SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # semgrep/semgrep-action@v1 has no SARIF output (only `config` and
      # `publishToken` inputs), so nothing surfaces in GitHub's code
      # scanning, which is what Scorecard's SAST check actually looks for.
      # This runs Semgrep a second time purely to produce that SARIF file;
      # it does not change the pass/fail gating above.
      - name: Generate SARIF for code scanning
        if: always()
        run: |
          python3 -m pip install semgrep==1.169.0
          semgrep scan --config=auto --sarif --output=semgrep.sarif || true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v3
        with:
          sarif_file: semgrep.sarif

  trivy:
    name: Trivy — Dependency CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Trivy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.71.2 \
            --repo aquasecurity/trivy \
            --pattern "trivy_0.71.2_Linux-64bit.deb" \
            --output /tmp/trivy.deb
          sudo dpkg -i /tmp/trivy.deb

      - name: Run Trivy filesystem scan
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL .

  rl-protect:
    name: rl-protect — Supply Chain Scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Advisory only: the baseline profile fails versions published in the last
      # few days, which would block fresh Dependabot PRs. Findings show in the run
      # log and job summary; they do not fail the job. The CLI does not accept
      # package-lock.json, so this scans package.json (direct dependencies).
      # RL_TOKEN must exist as an Actions secret, and as a Dependabot secret for
      # Dependabot-triggered runs.
      - name: Run rl-protect scan
        id: rl-protect
        continue-on-error: true
        uses: reversinglabs/gh-action-rl-protect-scan@0bb13857dc6dceab3385341dcf19943e52fc88f3  # v2.0.2
        env:
          RL_TOKEN: ${{ secrets.RL_TOKEN }}
        with:
          scan-path: package.json
          scan-profile: baseline
          check-deps: release,develop

      - name: Summarize result
        if: always()
        env:
          RL_STATUS: ${{ steps.rl-protect.outcome }}
          RL_DESCRIPTION: ${{ steps.rl-protect.outputs.description }}
        run: |
          {
            echo "### rl-protect (advisory)"
            echo "Step outcome: ${RL_STATUS}"
            echo "${RL_DESCRIPTION}"
          } >> "$GITHUB_STEP_SUMMARY"

  checkov:
    name: Checkov — IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e  # v12
        with:
          directory: .github/workflows
          quiet: true
          soft_fail: false
