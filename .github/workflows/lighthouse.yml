name: Lighthouse CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Pull request builds include future-dated (scheduled) posts so accessibility, Lighthouse and
  # link checks cover a new article before it goes live. Pushes to main build as production does.
  INCLUDE_FUTURE_POSTS: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # needed to find the posts this PR changes

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # onnxruntime-node downloads a CUDA GPU binary on Linux x64 by default;
          # that release asset now 404s and CI has no GPU. Skip it.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Serve site and run Lighthouse CI
        run: |
          npx astro preview --port 4321 &
          timeout 30 bash -c 'until curl -sf http://localhost:4321 > /dev/null 2>&1; do sleep 1; done'
          # The configured URLs plus the page of every post this PR adds or changes.
          urls="$(node scripts/lhci-urls.mjs "origin/${BASE_REF}")"
          # shellcheck disable=SC2086
          npx lhci autorun $urls
        env:
          BASE_REF: ${{ github.base_ref }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
