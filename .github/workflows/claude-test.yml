name: Claude (throwaway test)

# Throwaway test of the Claude Code GitHub Action using a Pro subscription
# token. Responds ONLY to @claude comments from the repo owner. Delete this
# file if the test fails or once the real pipeline workflow replaces it.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude:
    name: Claude
    # Gate on the commenter's identity BEFORE any job starts, so strangers
    # on this public repo can never spend quota or reach the token.
    if: >-
      github.event.comment.user.login == 'rustymuffler' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 8
            --allowedTools "Bash(gh pr create:*)"
