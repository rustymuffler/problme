name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'content/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # onnxruntime-node downloads a CUDA GPU binary on Linux x64 by default;
          # that release asset now 404s and CI has no GPU. Skip it.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  links:
    name: Link checker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # onnxruntime-node downloads a CUDA GPU binary on Linux x64 by default;
          # that release asset now 404s and CI has no GPU. Skip it.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.8.0
        with:
          args: --config .lychee.toml dist/**/*.html
          fail: true

  a11y:
    name: Accessibility (axe, WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # onnxruntime-node downloads a CUDA GPU binary on Linux x64 by default;
          # that release asset now 404s and CI has no GPU. Skip it.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright starts `astro preview` itself (see playwright.config.ts)
      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
